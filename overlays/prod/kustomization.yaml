apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namePrefix: prod-
namespace: prod
patches:
  - target:
      kind: Deployment
      name: app-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
configMapGenerator:
  - name: app-config
    envs:
      - app.env
